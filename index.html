<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Форум общения • декабрь 2012</title>
  <style>
    :root{
      --bg:#e9edf3;
      --panel:#ffffff;
      --line:#c9d4e2;
      --line2:#dfe6ef;
      --text:#1f2a37;
      --muted:#6b7280;
      --blue:#2f5ea8;
      --blue2:#537fcb;
      --soft:#f4f7fc;
      --shadow:0 8px 24px rgba(15, 23, 42, .08);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Tahoma, Verdana, Arial, sans-serif;
      color:var(--text);
      background:
        linear-gradient(180deg, #dfe7f2 0%, #eef2f7 35%, #f4f7fb 100%);
    }

    a{color:var(--blue); text-decoration:none}
    a:hover{text-decoration:underline}

    .page{
      max-width:1180px;
      margin:0 auto;
      padding:16px;
    }

    .shell{
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      box-shadow:var(--shadow);
      background:var(--panel);
    }

    .header{
      padding:18px 20px;
      color:#fff;
      background:linear-gradient(180deg, #547fd0 0%, #345f9f 100%);
    }

    .title{
      margin:0;
      font-size:30px;
      line-height:1.1;
      letter-spacing:.2px;
      font-weight:700;
    }

    .subtitle{
      margin-top:6px;
      font-size:14px;
      opacity:.94;
    }

    .nav{
      display:flex;
      flex-wrap:wrap;
      gap:18px;
      padding:10px 20px;
      font-size:14px;
      background:#f6f8fc;
      border-bottom:1px solid var(--line);
    }

    .nav span{color:var(--muted)}

    .layout{
      display:grid;
      grid-template-columns: 270px 1fr;
      gap:16px;
      padding:16px;
      background:linear-gradient(180deg, #f9fbfe 0%, #f4f7fb 100%);
    }

    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
    }

    .card-head{
      padding:12px 14px;
      font-weight:700;
      font-size:15px;
      background:linear-gradient(180deg, #f7f9fc 0%, #e9eef7 100%);
      border-bottom:1px solid var(--line);
    }

    .card-body{padding:14px}

    .board{
      padding:10px 0;
      border-bottom:1px solid #edf1f6;
    }
    .board:last-child{border-bottom:none}
    .board-title{
      font-weight:700;
      color:var(--blue);
      margin-bottom:5px;
      font-size:14px;
    }
    .board p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .side-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .side-link{
      border:1px solid var(--line);
      border-radius:10px;
      background:linear-gradient(180deg, #fff 0%, #fafcff 100%);
      padding:12px;
      transition:.15s ease;
      display:block;
      color:var(--text);
    }

    .side-link:hover{
      border-color:#9eb5db;
      background:#f8fbff;
      transform:translateY(-1px);
      text-decoration:none;
    }

    .side-link.active{
      background:#f1f6ff;
      border-color:#91addd;
    }

    .side-link .meta{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .side-link .name{
      font-weight:700;
      line-height:1.35;
      margin-bottom:4px;
    }

    .side-link .desc{
      font-size:13px;
      color:var(--muted);
      line-height:1.4;
    }

    .thread{
      display:flex;
      flex-direction:column;
    }

    .thread-head{
      padding:16px 18px;
      background:linear-gradient(180deg, #ffffff 0%, #f6f9ff 100%);
      border-bottom:1px solid var(--line);
    }

    .thread-title{
      margin:0 0 6px 0;
      font-size:22px;
      line-height:1.25;
      color:#203047;
    }

    .thread-info{
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    .pill{
      display:inline-block;
      margin-top:10px;
      font-size:12px;
      padding:4px 8px;
      border-radius:999px;
      background:#eef4ff;
      border:1px solid #ccd9f2;
      color:#355f9f;
    }

    .posts{
      padding:16px 18px 6px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .post{
      display:grid;
      grid-template-columns: 54px 1fr;
      gap:12px;
      padding:14px;
      border:1px solid #dbe3ee;
      border-radius:10px;
      background:#fff;
    }

    .avatar{
      width:54px;
      height:54px;
      border-radius:12px;
      border:1px solid #a9bfe7;
      background:linear-gradient(180deg, #dde8ff 0%, #c9d8f8 100%);
      color:#294a86;
      font-size:18px;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
    }

    .post-head{
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
      font-size:13px;
    }

    .nick{
      font-weight:700;
      color:#294a86;
    }

    .date{
      color:var(--muted);
    }

    .role{
      display:inline-block;
      padding:2px 7px;
      border-radius:999px;
      background:#edf4ff;
      color:#355f9f;
      border:1px solid #cad8f3;
      font-size:12px;
    }

    .post-text{
      white-space:pre-wrap;
      line-height:1.55;
      font-size:14px;
      word-break:break-word;
    }

    .post.reply{
      background:#f8fbff;
    }

    .section-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:14px;
      margin-top:14px;
    }

    .section-card{
      border:1px solid var(--line);
      border-radius:12px;
      background:linear-gradient(180deg, #fff 0%, #fafcff 100%);
      padding:14px;
      transition:.15s ease;
      display:block;
      color:var(--text);
    }

    .section-card:hover{
      transform:translateY(-1px);
      border-color:#9eb5db;
      background:#f8fbff;
      text-decoration:none;
    }

    .section-card h3{
      margin:0 0 6px 0;
      color:var(--blue);
      font-size:16px;
    }

    .section-card p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .topic-grid{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-top:14px;
    }

    .topic-card{
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      padding:14px;
      display:block;
      color:var(--text);
      transition:.15s ease;
    }

    .topic-card:hover{
      transform:translateY(-1px);
      border-color:#9eb5db;
      background:#f8fbff;
      text-decoration:none;
    }

    .topic-card .t-title{
      font-weight:700;
      color:var(--text);
      margin-bottom:6px;
      line-height:1.35;
    }

    .topic-card .t-desc{
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
    }

    .topic-card .t-meta{
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
    }

    .hero{
      padding:16px 18px;
      border:1px solid var(--line);
      border-radius:12px;
      background:linear-gradient(180deg, #ffffff 0%, #f6f9ff 100%);
    }

    .hero h2{
      margin:0 0 8px 0;
      color:#203047;
      font-size:20px;
    }

    .hero p{
      margin:0;
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
    }

    .crumbs{
      margin-bottom:10px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .crumbs a{color:var(--blue)}

    .footer{
      padding:14px 18px 18px;
      border-top:1px solid var(--line2);
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
      background:#fbfcfe;
    }

    .small-note{
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
    }

    @media (max-width: 920px){
      .layout{grid-template-columns:1fr}
      .section-grid,.topic-grid{grid-template-columns:1fr}
    }
  </style>
</head>

        posts: [
          {
            nick: "calmstreet",
            time: "16.12.2012, 18:12",
            role: "Участник",
            text: "А если ничего не случится, всё равно хочется встретиться потом."
          },
          {
            nick: "smallspark",
            time: "16.12.2012, 18:26",
            role: "Участник",
            text: "Мне кажется, это уже стало не про конец света, а про людей."
          },
          {
            nick: "benchlight",
            time: "16.12.2012, 18:43",
            role: "Участник",
            text: "И это, честно говоря, даже лучше."
          }
        ]
      }
    };

    const sidebarEl = document.getElementById("sidebar");
    const contentEl = document.getElementById("content");

    let mainThreadOpenedAt = null;
    let mainThreadTimer = null;

    function esc(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getRoute(){
      const raw = (location.hash || "#home").replace(/^#/, "");
      const parts = raw.split("/");
      return {
        type: parts[0] || "home",
        slug: parts[1] || ""
      };
    }

    function sectionById(id){
      return sections.find(s => s.id === id);
    }

    function topicById(id){
      return topics[id];
    }

    function topicLink(topicId){
      const t = topicById(topicId);
      return `<a class="side-link" href="#topic/${t.id}">
        <div class="meta"><span>${esc(sectionById(t.sectionId).name)}</span><span>Тема</span></div>
        <div class="name">${esc(t.title)}</div>
        <div class="desc">${esc(t.teaser)}</div>
      </a>`;
    }

    function sectionLink(section, active = false){
      return `<a class="side-link ${active ? "active" : ""}" href="#section/${section.id}">
        <div class="meta"><span>${esc(section.name)}</span><span>${section.topics.length} темы</span></div>
        <div class="name">${esc(section.name)}</div>
        <div class="desc">${esc(section.desc)}</div>
      </a>`;
    }

    function renderSidebar(route){
      let html = `
        <div class="card-head">Разделы форума</div>
        <div class="card-body side-list">
          ${sections.map(sec => sectionLink(sec, route.type === "section" && route.slug === sec.id)).join("")}
        </div>
      `;

      let extra = "";
      if(route.type === "home"){
        extra = `
          <div class="card-head">Главная тема</div>
          <div class="card-body side-list">
            ${topicLink("main-end")}
          </div>
        `;
      } else if(route.type === "section"){
        const sec = sectionById(route.slug);
        if(sec){
          extra = `
            <div class="card-head">Темы раздела «${esc(sec.name)}»</div>
            <div class="card-body side-list">
              ${sec.topics.map(topicLink).join("")}
            </div>
          `;
        }
      } else if(route.type === "topic"){
        const top = topicById(route.slug);
        const sec = top ? sectionById(top.sectionId) : null;
        if(sec){
          extra = `
            <div class="card-head">Похожие темы</div>
            <div class="card-body side-list">
              ${sec.topics.filter(id => id !== top.id).map(topicLink).join("") || `<div class="board"><p>В этом разделе пока только одна открытая тема.</p></div>`}
            </div>
          `;
        }
      }

      sidebarEl.innerHTML = html + extra;
    }

    function postHtml(post, cls = ""){
      const initial = (post.nick || "?").replace(/[^a-zA-Zа-яА-Я0-9]/g, "")[0] || "?";
      return `
        <div class="post ${cls}">
          <div class="avatar">${esc(initial.toUpperCase())}</div>
          <div>
            <div class="post-head">
              <span class="nick">${esc(post.nick)}</span>
              <span class="date">${esc(post.time)}</span>
              <span class="role">${esc(post.role)}</span>
            </div>
            <div class="post-text">${esc(post.text)}</div>
          </div>
        </div>
      `;
    }

    function homeHtml(){
      return `
        <div class="thread-head">
          <div class="crumbs">Главная</div>
          <h2 class="thread-title">Декабрь 2012, и тема уже пошла по кругу</h2>
          <div class="thread-info">
            Здесь живут разделы, темы и разговоры про конец света. Всё выглядит так, как будто люди ещё не до конца поняли, насколько им страшно.
          </div>
        </div>
        <div class="posts">
          <div class="hero">
            <h2>Добро пожаловать на форум</h2>
            <p>Светлый старый интерфейс, короткие сообщения, простые темы и одна главная история про то, как люди собирались не быть одни, если 21 декабря окажется последним днём.</p>
          </div>

          <div class="section-grid">
            ${sections.map(sec => `
              <a class="section-card" href="#section/${sec.id}">
                <h3>${esc(sec.name)}</h3>
                <p>${esc(sec.desc)}</p>
              </a>
            `).join("")}
          </div>

          <div class="hero">
            <h2>Главная тема</h2>
            <p>
              <a href="#topic/main-end"><b>${esc(topics["main-end"].title)}</b></a><br />
              Самая важная тема форума. Сначала пишет только Олег, а ответы приходят ночью.
            </p>
          </div>
        </div>
        <div class="footer">
          Форум в стиле старого интернета. Всё просто, немного криво и очень по-человечески.
        </div>
      `;
    }

    function sectionHtml(section){
      const topicCards = section.topics.map(id => {
        const t = topicById(id);
        return `
          <a class="topic-card" href="#topic/${t.id}">
            <div class="t-title">${esc(t.title)}</div>
            <div class="t-desc">${esc(t.teaser)}</div>
            <div class="t-meta">Открыть тему • ${esc(t.kind === "dynamic" ? "живая ночь" : "обычный тред")}</div>
          </a>
        `;
      }).join("");

      return `
        <div class="thread-head">
          <div class="crumbs"><a href="#home">Главная</a> › ${esc(section.name)}</div>
          <h2 class="thread-title">${esc(section.name)}</h2>
          <div class="thread-info">${esc(section.desc)} Здесь тоже везде всплывает тема конца света, даже если люди пытаются говорить о другом.</div>
        </div>
        <div class="posts">
          <div class="hero">
            <h2>Раздел «${esc(section.name)}»</h2>
            <p>Темы этого раздела звучат как куски живого форума 2012 года. Нажми на любую, чтобы открыть тред.</p>
          </div>
          <div class="topic-grid">
            ${topicCards}
          </div>
        </div>
        <div class="footer">
          Раздел открыт. В старом форуме темы ждали, пока кто-то наконец ответит ночью.
        </div>
      `;
    }

    function staticTopicHtml(topic){
      return `
        <div class="thread-head">
          <div class="crumbs">
            <a href="#home">Главная</a> › <a href="#section/${topic.sectionId}">${esc(sectionById(topic.sectionId).name)}</a> › ${esc(topic.title)}
          </div>
          <h2 class="thread-title">${esc(topic.title)}</h2>
          <div class="thread-info">${esc(topic.info)}</div>
        </div>
        <div class="posts">
          ${topic.posts.map((p, i) => postHtml(p, i > 0 ? "reply" : "")).join("")}
        </div>
        <div class="footer">
          Тема выглядит как обычный тред старого форума: короткие ответы, простые ники и постоянное невидимое напряжение вокруг 21 декабря.
        </div>
      `;
    }

    function mainTopicHtml(topic){
      const elapsed = mainThreadOpenedAt ? Date.now() - mainThreadOpenedAt : 0;
      const loaded = elapsed >= LOAD_DELAY;

      const posts = [topic.initialPost];
      if(loaded){
        posts.push(...topic.replies, topic.finalPost);
      }

      return `
        <div class="thread-head">
          <div class="crumbs">
            <a href="#home">Главная</a> › <a href="#section/${topic.sectionId}">${esc(sectionById(topic.sectionId).name)}</a> › ${esc(topic.title)}
          </div>
          <h2 class="thread-title">${esc(topic.title)}</h2>
          <div class="thread-info">${esc(loaded ? topic.loadedInfo : topic.initialInfo)}</div>
          ${loaded ? `<div class="pill">Тема закрыта</div>` : ``}
        </div>
        <div class="posts">
          ${posts.map((p, i) => postHtml(p, i > 0 ? "reply" : "")).join("")}
        </div>
        <div class="footer">
          ${loaded
            ? `Тема закрыта утром 15.12.2012. После этого на форуме уже ничего не добавляли.`
            : `Сейчас в теме пока только первый пост. Ночью сюда придут ответы, а утром Олег напишет свой ответ и закроет тему.`}
        </div>
      `;
    }

    function renderContent(route){
      if(route.type === "home"){
        contentEl.className = "card thread";
        contentEl.innerHTML = homeHtml();
        document.title = "Форум общения • декабрь 2012";
        return;
      }

      if(route.type === "section"){
        const sec = sectionById(route.slug);
        if(!sec){
          location.hash = "#home";
          return;
        }
        contentEl.className = "card thread";
        contentEl.innerHTML = sectionHtml(sec);
        document.title = `${sec.name} • Форум общения`;
        return;
      }

      if(route.type === "topic"){
        const topic = topicById(route.slug);
        if(!topic){
          location.hash = "#home";
          return;
        }
        contentEl.className = "card thread";
        if(topic.kind === "dynamic"){
          if(!mainThreadOpenedAt){
            mainThreadOpenedAt = Date.now();
          }
          const elapsed = Date.now() - mainThreadOpenedAt;
          if(elapsed < LOAD_DELAY){
            if(mainThreadTimer) clearTimeout(mainThreadTimer);
            mainThreadTimer = setTimeout(() => {
              const r = getRoute();
              if(r.type === "topic" && r.slug === "main-end"){
                render();
              }
            }, LOAD_DELAY - elapsed);
          }
          contentEl.innerHTML = mainTopicHtml(topic);
          document.title = `${topic.title} • Форум общения`;
        } else {
          contentEl.innerHTML = staticTopicHtml(topic);
          document.title = `${topic.title} • Форум общения`;
        }
        return;
      }

      location.hash = "#home";
    }

    function render(){
      const route = getRoute();
      renderSidebar(route);
      renderContent(route);
    }

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
